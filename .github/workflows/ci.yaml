name: Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# fmt-check, lint, strlint and typecheck run in parallel.
# test runs only after all four pass (needs:).
jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: prefeitura-rio/actions/quality-gate@a7d3d63f5f5196800517d94c569ce255591a56e0 # TODO: update SHA after committing quality-gate
        with:
          check: app:format

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: prefeitura-rio/actions/quality-gate@a7d3d63f5f5196800517d94c569ce255591a56e0 # TODO: update SHA after committing quality-gate
        with:
          check: app:lint

  strlint:
    name: Structural Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: prefeitura-rio/actions/quality-gate@a7d3d63f5f5196800517d94c569ce255591a56e0 # TODO: update SHA after committing quality-gate
        with:
          check: app:strlint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: prefeitura-rio/actions/quality-gate@a7d3d63f5f5196800517d94c569ce255591a56e0 # TODO: update SHA after committing quality-gate
        with:
          check: app:typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [format, lint, strlint, typecheck]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: prefeitura-rio/actions/quality-gate@a7d3d63f5f5196800517d94c569ce255591a56e0 # TODO: update SHA after committing quality-gate
        with:
          check: app:test
