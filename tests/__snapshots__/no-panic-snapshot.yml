id: no-panic
snapshots:
  ? |
    func handle() error {
      if err != nil {
        panic(err)
      }
      return nil
    }
  : labels:
    - source: panic(err)
      style: primary
      start: 44
      end: 54
  ? |
    func handle() {
      panic("boom")
    }
  : labels:
    - source: panic("boom")
      style: primary
      start: 18
      end: 31
