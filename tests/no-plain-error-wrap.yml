id: no-plain-error-wrap
language: Go
valid:
  - |
    fmt.Errorf("failed: %w", err)
  - |
    fmt.Errorf("count: %d", n)
  - |
    fmt.Errorf("user %s failed: %w", user, err)
  - |
    fmt.Errorf("failed: %w and %w", err1, err2)
invalid:
  - |
    fmt.Errorf("failed: %v", err)
  - |
    fmt.Errorf("failed: %s", err.Error())
  - |
    fmt.Errorf("failed: %v", err, other)
  - |
    fmt.Errorf("user %s failed: %v", user, err)
